<div class="form-check form-check-inline" title="Only recipes you have favorited">
    <input class="form-check-input" type="checkbox" id="favorites-only-toggle"
           {% if favorites_only %}checked{% endif %}
           hx-get="{% url 'recipes' %}"
           hx-target="#recipe-results"
           hx-include="#search_term, #sort_by"
           hx-vals='js:{...jolofFilterVals()}'>
    <label class="form-check-label" for="favorites-only-toggle">
        Favorites
    </label>
</div>
