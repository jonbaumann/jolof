{% extends 'main/base.html' %} {% block title %}Login{% endblock %}
{% load static crispy_forms_tags %}
{% block navbar %}{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width: 420px;">
  <div class="text-center my-4">
    <img class="logo-on-light" src="{% static 'branding/jolof-wordmark-light.png' %}" alt="Jolof" style="height: 80px;">
    <img class="logo-on-dark" src="{% static 'branding/jolof-wordmark-dark.png' %}" alt="Jolof" style="height: 80px;">
  </div>
  <form method="post">
  {% csrf_token %}{{form|crispy}}
  <button type="submit" class="btn btn-success">Login</button>
  </form>
</div>
{% endblock %}
